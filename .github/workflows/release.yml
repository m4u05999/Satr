name: التحقق وإصدار ويندوز

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:

# القراءة هي الأصل؛ مهمة الإصدار وحدها ترفع الصلاحية إلى الكتابة.
permissions:
  contents: read

# دفعة جديدة على الفرع نفسه تلغي التي قبلها — كان push وpull_request يشغّلان
# التحقق مرتين على الكود نفسه، وبوابة الاختبارات أدناه أثقل من أن تُهدر مرتين.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    name: التحقق الخفيف
    runs-on: windows-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v6

      - name: إعداد Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: تثبيت الاعتماديات المقفلة
        run: npm ci

      - name: فحص صياغة ملفات العملية الرئيسية
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem electron -Filter *.js -File) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "فشل الفحص النحوي: $($file.FullName)"
            }
          }

      - name: التحقق من تزامن CSP
        shell: pwsh
        run: |
          node scripts/update-csp.js
          git diff --exit-code -- src/index.html

  # بوابة الاختبارات — تحوّل CI من «الملف يُفسَّر» إلى «الطقم يعمل».
  # كان `test:full` (‏86 مجموعة) لا يستدعيه أي مسار عمل، فدفعةٌ تحذف منطق ميزة
  # كاملة تبقى خضراء ما دام الملف يُفسَّر. القياس (2026-09-03، لينكس تحت xvfb):
  # 80/86 تنجح — بما فيها اختبارات Electron الحية — والست الباقية حدود معلَنة
  # يتخطّاها المشغّل صراحةً (SKIP_ON_POSIX في scripts/full-suite.js) لا صمتاً.
  # لينكس لا ويندوز لأن الدقائق أرخص ثلاث مرات والتشغيل الكامل ~5 دقائق.
  tests:
    name: بوابة الاختبارات (لينكس)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # التاريخ الكامل هنا وحده من مواضع checkout الستة: هذه الوظيفة تشغّل `test:full`
      # وهي المرشّحة لتصير فحصاً مطلوباً على `main`، فثمن الأخضر الكاذب فيها أعلى ما يكون.
      # ودليل الخطر حيّ لا مفترض: `scripts/full-suite-evidence.js:53-59` يبتلع فشل git في
      # `catch` ويعيد `null` — نمطٌ يجعل حارساً يقرأ التاريخ يصمت بدل أن يصرخ. الكلفة
      # مقيسة: 595 التزاماً و‏16م.ب كامل `.git`. البقية تقرأ شجرة العمل لا التاريخ فتبقى سطحية.
      - name: جلب المستودع
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: إعداد Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: تثبيت الاعتماديات المقفلة
        run: npm ci

      # اختبارات Electron الحية تحتاج شاشة؛ xvfb يوفّر واحدة افتراضية.
      - name: تثبيت xvfb
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      # أول تشغيل حقيقي (‏33772062720، 2026-09-03) أسقط كل اختبار Electron حيّ (24 مجموعة)
      # بـ`FATAL: setuid_sandbox_host — SUID sandbox helper found but not configured`
      # ثم SIGTRAP: ubuntu-latest صار 24.04 وAppArmor فيه يمنع user namespaces غير
      # المميّزة، فلا يجد Chromium أيّ sandbox يعمل. رفع القيد يُبقي sandbox الفضاءات
      # الحقيقي عاملاً — أدق من ELECTRON_DISABLE_SANDBOX الذي يعطّله كلياً.
      - name: السماح بـsandbox فضاءات الأسماء لـChromium (‏Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: الطقم الكامل
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run test:full
        env:
          CI: '1'

  release:
    name: بناء ونشر مثبّت ويندوز
    if: startsWith(github.ref, 'refs/tags/v')
    # قرار مالك (2026-09-03): بوابة الاختبارات تُبلّغ ولا تمنع الإصدار في جولتها الأولى —
    # لم تُشغَّل على Actions فعلياً بعد (Node 20 على لينكس مقابل 26 على جهاز التطوير). بعد
    # تشغيلين ناجحين على `main` تُضاف `tests` هنا فتصير شرطاً؛ لا أحمر يعطّل إصداراً بلا سبب مقيس.
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v6

      - name: إعداد Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # يمنع إنشاء إصدار بعنوان لا يطابق النسخة المبنية فعلياً.
      - name: مطابقة الوسم مع package.json
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}' -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "الوسم v$tagVersion لا يطابق package.json ($packageVersion)"
          }

      # ‏OBS-054: رابط التنزيل في README مبنيّ على اسم الأصل حرفياً، فتأخّرُ الرقم
      # يعني 404 في الواجهة الأولى للمشروع — وقع سبع مرات متتالية. الفحص هنا
      # **عند الوسم لا عند كل push**: بين الإصدارات يكون README على الرقم المنشور
      # بينما package.json قد رُفع، ففحصٌ أبكر كان سيكسر CI على عمل سليم.
      - name: مطابقة رقم الإصدار في README
        run: node scripts/sync-readme-version.js --check

      - name: تثبيت الاعتماديات المقفلة
        run: npm ci

      # npmRebuild:false في package.json يمنع إعادة بناء node-pty تحت Electron.
      - name: بناء الأصول ورفعها إلى مسودة الإصدار
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: إنشاء ورفع نسخة ZIP من المثبّت
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem dist -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw 'لم يُعثر على مثبّت exe في dist' }
          $zip = Join-Path dist "Satr-Setup-$version.zip"
          Compress-Archive -LiteralPath $exe.FullName -DestinationPath $zip -CompressionLevel Optimal -Force
          gh release upload '${{ github.ref_name }}' $zip --clobber

      - name: التحقق من أصول التحديث
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(gh release view '${{ github.ref_name }}' --json assets --jq '.assets[].name')
          if (-not ($assets | Where-Object { $_ -like '*.exe' })) {
            throw 'لم يُرفع مثبّت exe'
          }
          if (-not ($assets | Where-Object { $_ -eq 'latest.yml' })) {
            throw 'لم يُرفع latest.yml'
          }
          if (-not ($assets | Where-Object { $_ -like '*.blockmap' })) {
            throw 'لم يُرفع blockmap'
          }
          if (-not ($assets | Where-Object { $_ -like 'Satr-Setup-*.zip' })) {
            throw 'لم تُرفع نسخة ZIP من المثبّت'
          }

      # electron-builder ينشئ مسودة افتراضياً؛ هذه الخطوة تحسب بصمة المثبّت،
      # تُدرجها في ملاحظات الإصدار (فلا تُحدَّث يدوياً في README)، ثم تنشر بلا تدخل.
      - name: نشر إصدار GitHub مع بصمة المثبّت
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem dist -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw 'لم يُعثر على مثبّت exe في dist' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          # GitHub يستبدل الفراغات بشرطات في اسم الأصل المرفوع — نطابقه في الملاحظات.
          $assetName = $exe.Name -replace ' ', '-'
          # «ما الجديد؟» في إشعار التحديث يفتح هذه الصفحة، فيجب أن تحمل الجديد فعلاً لا
          # اسم الملف وبصمته فقط. نستخرج قسم الإصدار الجاري من CHANGELOG.md؛ وغيابه لا
          # يكسر النشر — تبقى الملاحظات كما كانت.
          $notes = @()
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if (Test-Path CHANGELOG.md) {
            $all = Get-Content CHANGELOG.md -Encoding utf8
            $start = -1
            for ($i = 0; $i -lt $all.Count; $i++) {
              if ($all[$i] -match "^##\s+$([regex]::Escape($version))(\s|$)") { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $all.Count
              for ($j = $start + 1; $j -lt $all.Count; $j++) {
                if ($all[$j] -match '^##\s') { $end = $j; break }
              }
              $notes = $all[($start + 1)..($end - 1)]
            }
          }
          $lines = @()
          if ($notes.Count -gt 0) { $lines += $notes; $lines += "" ; $lines += "---"; $lines += "" }
          $lines += @(
            "**المثبّت:** ``$assetName`` — حمّله من قسم **Assets** (بكلمة Setup، لا «Source code»).",
            "",
            "**بصمة SHA-256** (للتحقق الاختياري من سلامة الملف):",
            "",
            "    $hash"
          )
          $lines | Out-File release-notes.md -Encoding utf8
          gh release edit '${{ github.ref_name }}' --notes-file release-notes.md --draft=false --latest
