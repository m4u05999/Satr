name: نشر صفحة الهبوط (GitHub Pages)

# ينشر مجلد site/ الثابت كما هو — لا خطوة بناء (الموقع خالص بلا تجميع،
# والمكتبات مضمّنة vendored). يعمل عند تغيّر site/ على main أو يدوياً.
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

# الحد الأدنى الذي يطلبه deploy-pages؛ بقية المهام في release.yml تبقى قراءة
permissions:
  contents: read
  pages: write
  id-token: write

# نشر واحد في كل مرة — دفعة أحدث تلغي المعلّقة
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v6

      - name: تهيئة Pages
        uses: actions/configure-pages@v5

      - name: رفع site/ كأثر Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
