<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>لقطات «ولّد من سطر» الحتمية</title>
  <link rel="stylesheet" href="../../src/vendor/fonts.css">
  <link rel="stylesheet" href="../../src/styles/base.css">
  <link rel="stylesheet" href="site-shots-gen.css">
</head>
<body>
  <div class="gen-shot-scene gen-chat-scene" data-gen-scene="chat">
    <header class="gen-shot-bar">
      <strong>سطر</strong>
      <span>المحادثة · مشروع الحملة العربية</span>
      <bdi>Codex</bdi>
    </header>
    <div class="gen-chat-host">
      <span id="costInfo" hidden></span>
      <satr-chat id="generationChat"></satr-chat>
    </div>
  </div>

  <div class="gen-shot-scene gen-gallery-scene" data-gen-scene="gallery">
    <div class="gen-gallery-backdrop" aria-hidden="true">
      <strong>سطر</strong>
      <span>المحادثة</span>
      <span>الملفات</span>
      <span class="active">المعرض 🖼</span>
    </div>
    <satr-gallery-panel id="generationGallery"></satr-gallery-panel>
  </div>

  <div class="gen-shot-scene gen-permission-scene" data-gen-scene="permission">
    <div class="gen-permission-context" aria-hidden="true">
      <header class="gen-shot-bar"><strong>سطر</strong><span>التوليد ينتظر قرارك</span><bdi>generate_media</bdi></header>
      <div class="gen-context-lines"><span></span><span></span><span></span></div>
    </div>
    <satr-perm-dialog id="generationPermission"></satr-perm-dialog>
  </div>

  <script src="site-shots-reset.js"></script>
  <script src="site-shots-gen-page.js"></script>
  <script type="module" src="../../src/ui/components/chat.js"></script>
  <script type="module" src="../../src/ui/components/gallery-panel.js"></script>
  <script type="module" src="../../src/ui/components/perm-dialog.js"></script>
</body>
</html>
