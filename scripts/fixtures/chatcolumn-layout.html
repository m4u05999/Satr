<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>chat column layout</title>
  <script src="chatcolumn-layout-config.js"></script>
  <link rel="stylesheet" href="../../src/vendor/fonts.css">
  <link rel="stylesheet" href="../../src/styles/base.css">
  <link rel="stylesheet" href="chatcolumn-layout.css">
</head>
<body>
<input id="cwd" value="D:\sater\satr-2" aria-hidden="true">

<div id="midRow">
<div id="chatColumn">
<satr-chat>
<main><div class="thread"><div class="empty"><p>محتوى اختبار التخطيط</p></div></div></main>
</satr-chat>
<satr-composer>
<footer>
  <div id="bgBar" aria-label="قيد التشغيل">
    <span class="bg-label"><span class="bg-dot" aria-hidden="true"></span>قيد التشغيل</span>
    <span id="bgChips" class="bg-chips"></span>
    <button id="bgKillAll" type="button">إيقاف الكل</button>
  </div>
  <div id="attachments" class="attachments" aria-label="الصور المرفقة"></div>
  <!-- شريط المؤلّف (§5-د): محرك/نموذج + إرفاق، بجوار الإرسال (نمط Cursor) -->
  <div class="composer-tools">
    <span class="ct-label">المحرك</span>
    <select id="engine" title="المحرك/المزوّد">
      <option value="sdk">Claude — اشتراك Claude Code</option>
      <option value="codex">Codex — اشتراك ChatGPT</option>
      <option value="cli">Claude CLI — احتياطي</option>
      <option value="gemini">Google Gemini — مفتاح API</option>
    </select>
    <span class="ct-label">النموذج</span>
    <select id="model" title="النموذج"><option value="">الافتراضي</option></select>
    <button id="attachBtn" type="button" title="إرفاق صورة من الجهاز (للمحركات الداعمة للصور)">📎 إرفاق</button>
    <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  </div>
  <!-- شريط الوعي: ما لا يظهر في صف المحرك/النموذج أعلاه فقط — أُزيل «model:» المكرّر
       (منتقي النموذج بجواره يعرض الاسم الكامل)، وعُرّبت التسميات (القاعدة 3) -->
  <div id="awarenessBar" class="awareness-bar" aria-label="حالة الدور الحالية">
    <button id="awarenessEffort" type="button" title="تدوير جهد التفكير">الجهد: الافتراضي</button>
    <span aria-hidden="true">·</span>
    <button id="awarenessThinking" type="button" title="تفعيل/تعطيل التفكير الحي (Kimi Code)">التفكير: —</button>
    <span aria-hidden="true">·</span>
    <button id="awarenessPerm" type="button" title="تدوير وضع الأذونات الآمن">الأذونات: افتراضي</button>
    <span aria-hidden="true">·</span>
    <button id="awarenessContext" type="button" title="فتح لوحة السياق">السياق: —</button>
  </div>
  <!-- دفعة E: اقتراح Claude يملأ المحرّر فقط ولا يرسل -->
  <button id="promptSuggestion" class="prompt-suggestion" type="button" hidden>
    <span class="prompt-suggestion-label">اقتراح Claude</span>
    <span id="promptSuggestionText" dir="auto"></span>
  </button>
  <div class="composer">
    <div id="slashMenu" role="listbox"></div>
    <div id="fileMenu" role="listbox"></div>
    <textarea id="input" placeholder="اكتب طلبك… (Enter للإرسال، Shift+Enter لسطر جديد، / للأوامر، @ للملفات)" rows="1" spellcheck="true"></textarea>
    <button id="browserCtl" type="button" aria-pressed="false" title="وضع تحكّم المتصفح: امنح المحرك الأصلي صلاحية قيادة المعاينة (يوافق تلقائياً على أفعال المتصفح فقط)">🖱️ متصفح</button>
    <button id="send">إرسال</button>
  </div>
  <div class="statusline">
    <span id="sessionInfo">لا جلسة</span>
    <span id="costInfo"></span>
  </div>
</footer>
</satr-composer>
</div>
<satr-ops-room aria-label="غرفة العمليات"></satr-ops-room>
<satr-preview-panel aria-label="المعاينة المدمجة"></satr-preview-panel>
</div>

<satr-terminal-panel>
  <section id="termPanel" aria-label="الطرفية المدمجة"></section>
</satr-terminal-panel>

<script src="chatcolumn-layout-page.js"></script>
<script type="module" src="../../src/ui/components/composer.js"></script>
</body>
</html>
