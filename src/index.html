<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>سطر — Satr</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="styles/base.css">
</head>
<body>

<!-- بوابة أول التشغيل: تحجب المحادثة حتى يتوفّر Claude Code (مانع إطلاق — المرحلة 6) -->
<!-- بوابة أول التشغيل: مكوّن Web Component (تفكيك ت-8) — ذاتي الفحص، يبث gate-ready عند الجهوز -->
<satr-gate></satr-gate>

<!-- الشريط العلوي + ⚙: مكوّن light DOM (تفكيك ت-11) — الترميز هنا (القشرة تربط عناصره
     عند الإقلاع)، والمكوّن يملك: مفاتيح المزوّدين/اختيار المجلد/المجلدات الإضافية/منبثق ⚙/Enterprise -->
<satr-topbar>
<header>
  <div class="wordmark">سطر<span class="cursor" aria-hidden="true"></span></div>
  <div class="controls">
    <div class="field">
      <label for="cwd">مجلد المشروع</label>
      <input type="text" id="cwd" placeholder="اختر مجلداً…" spellcheck="false">
      <button id="pickFolder" title="اختيار مجلد">📁</button>
    </div>
    <button id="newSession">جلسة جديدة</button>
    <button id="termToggle" title="الطرفية المدمجة">🖥️</button>
    <button id="previewToggle" title="المعاينة المدمجة — متصفح لمشروعك (م-1)">🌐</button>
    <button id="filesToggle" title="ملفات المشروع (عرض للقراءة)">📄</button>
    <button id="gitToggle" title="تغييرات المشروع منذ آخر التزام (git)">±</button>
    <button id="opsRoomToggle" title="غرفة العمليات">غرفة العمليات</button>
    <button id="exportChat" title="تصدير المحادثة الحالية (Markdown)">📤</button>
    <button id="themeToggle" title="تبديل الوضع الفاتح/الداكن">🌙</button>
    <!-- إعدادات قليلة اللمس (تُضبط مرة وتُنسى) مطوية خلف ⚙ لتخفيف الشريط — نفس المعرّفات فلا تغيير في المنطق -->
    <div class="settings-wrap">
      <button id="settingsBtn" title="الإعدادات">⚙</button>
      <div id="settingsPop" hidden>
        <!-- المحرك/النموذج/الصلاحيات انتقلت إلى شريط المؤلّف قرب زر الإرسال (§5-د) -->
        <div class="field ct-hint">التبديل السريع للمحرك والنموذج والصلاحيات بجوار زر الإرسال أسفل ↓</div>
        <div class="field">
          <label for="effort">جهد التفكير</label>
          <select id="effort" title="كم يفكّر النموذج قبل الرد — الأعلى أدق وأبطأ وأكلف (يُخفَّض صامتاً إن لم يدعمه النموذج)">
            <option value="">الافتراضي</option>
            <option value="low">منخفض — أسرع وأرخص</option>
            <option value="medium">متوسط</option>
            <option value="high">مرتفع</option>
            <option value="max">أقصى — للمهام المعقدة</option>
          </select>
        </div>
        <!-- مجلدات إضافية (المرحلة 14.4): تُمنح للنموذج وصولاً بجانب مجلد المشروع -->
        <div class="settings-dirs">
          <div class="dirs-head">
            <span>مجلدات إضافية</span>
            <button id="addDir" type="button" title="منح النموذج وصولاً لمجلد آخر بجانب مجلد المشروع">📁 إضافة</button>
          </div>
          <div id="dirChips"></div>
        </div>
        <!-- قسم «سطر Enterprise» (الدفعة 3): يظهر فقط عند تحميل الطبقة (satr:features) -->
        <div class="settings-keys" id="eeSection" hidden>
          <div class="dirs-head"><span>سطر Enterprise</span><span id="eeLicense" class="key-status"></span></div>
          <div id="eeUsageBox" class="ct-hint" dir="auto"></div>
          <div id="eeAuditBox" class="ct-hint" dir="auto"></div>
        </div>
        <!-- مركز مفاتيح المزوّدين (§5-ب): إدخال مفاتيح DeepSeek/Qwen/Gemini بصرياً (تُحفظ في ~/.satr/keys.json) -->
        <div class="settings-keys" id="keysMgr">
          <div class="dirs-head"><span>مفاتيح المزوّدين</span></div>
          <div class="key-row">
            <select id="keyProvider"></select>
            <span id="keyStatus" class="key-status"></span>
          </div>
          <div class="key-row">
            <input id="keyValue" type="password" placeholder="ألصق مفتاح API…" autocomplete="off" spellcheck="false">
            <button id="keySave" type="button">حفظ</button>
            <button id="keyClear" type="button">مسح</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
</satr-topbar>

<div id="banner"></div>

<!-- الصف الأوسط (م-1): عمود الدردشة + الأسطح الجانبية جنباً إلى جنب (flex أفقي RTL).
     عمود الدردشة يجمع الخيط والمؤلّف، بينما يبقى غلافا المكوّنين display:contents -->
<div id="midRow">
<div id="chatColumn">
<!-- خيط المحادثة: مكوّن light DOM (تفكيك ت-12 — بلا Shadow: البث يعيد بناء innerHTML
     وأنماط المنطقة في base.css؛ الغلاف display:contents يبني <main> بداخله).
     مجرى أحداث satr:event يبقى orchestration في القشرة ويستدعي methods المكوّن -->
<satr-chat></satr-chat>
<!-- المؤلّف: مكوّن light DOM (تفكيك ت-10) — المكوّن يملك ميكانيكا
     المرفقات/القوائم/المسودة/شريط الخلفية ويبث composer-send -->
<satr-composer>
<footer>
  <div id="bgBar" aria-label="عمليات قيد التشغيل">
    <span class="bg-label"><span class="bg-dot" aria-hidden="true"></span>عمليات قيد التشغيل</span>
    <span id="bgChips" class="bg-chips"></span>
    <button id="bgKillAll" type="button">إيقاف الكل</button>
  </div>
  <div id="attachments" class="attachments" aria-label="الصور المرفقة"></div>
  <!-- شريط المؤلّف (§5-د): محرك/نموذج/صلاحيات + إرفاق، بجوار الإرسال (نمط Cursor) -->
  <div class="composer-tools">
    <span class="ct-label">المحرك</span>
    <select id="engine" title="المحرك/المزوّد">
      <option value="sdk">SDK — بث وأذونات حية</option>
      <option value="codex">Codex — OpenAI (بث وأذونات)</option>
      <option value="cli">CLI — احتياطي</option>
      <option value="gemini">Gemini (REST)</option>
    </select>
    <span class="ct-label">النموذج</span>
    <select id="model" title="النموذج"><option value="">الافتراضي</option></select>
    <select id="perm" title="وضع الصلاحيات">
      <option value="acceptEdits">قبول التعديلات تلقائياً</option>
      <option value="plan">تخطيط فقط (بدون تنفيذ)</option>
      <option value="default">افتراضي</option>
      <option value="auto">تلقائي ذكي (يسأل عن التنفيذ والكتابة)</option>
      <option value="bypassPermissions">⚠ تجاوز كل الأذونات</option>
    </select>
    <button id="attachBtn" type="button" title="إرفاق صورة من الجهاز (محرك SDK)">📎 إرفاق</button>
    <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  </div>
  <div class="composer">
    <div id="slashMenu" role="listbox"></div>
    <div id="fileMenu" role="listbox"></div>
    <textarea id="input" placeholder="اكتب طلبك… (Enter للإرسال، Shift+Enter لسطر جديد، / للأوامر، @ للملفات)" rows="1"></textarea>
    <button id="browserCtl" type="button" aria-pressed="false" title="وضع تحكّم المتصفح: امنح الوكيل صلاحية قيادة المعاينة (يوافق تلقائياً على أفعال المتصفح فقط — محرك SDK)">🖱️ متصفح</button>
    <button id="send">إرسال</button>
  </div>
  <div class="statusline">
    <span id="sessionInfo">لا جلسة</span>
    <span id="costInfo"></span>
  </div>
</footer>
</satr-composer>
</div>
<!-- غرفة العمليات: سطح عمل مرن داخل الصف الأوسط كي يبقى محصوراً بين الهيدر والمؤلّف -->
<satr-ops-room aria-label="غرفة العمليات"></satr-ops-room>
<!-- لوحة المعاينة المدمجة (م-1 — الدفعة 5): إطار الرأس والمساحة فقط — الصفحة ترسمها
     WebContentsView أصلية معزولة تطفو فوق المساحة (satr:previewBounds يحدد مكانها) -->
<satr-preview-panel aria-label="المعاينة المدمجة"></satr-preview-panel>
</div>

<!-- الطرفية المدمجة (المرحلة 8.1): عارض xterm.js قياسي — عرض BiDi يأتي في 8.2 -->
<!-- الطرفية المدمجة: مكوّن light DOM (تفكيك ت-9 — بلا Shadow: xterm يقيس DOM المستند،
     الأنماط في base.css، والمكوّن غلاف display:contents يبني البنية نفسها بداخله) -->
<satr-terminal-panel></satr-terminal-panel>

<!-- إشعار التحديث التلقائي (المرحلة 17): يظهر أسفل النافذة، لا يقاطع العمل -->
<div id="updateToast" hidden>
  <span class="upd-ico" aria-hidden="true">⬇</span>
  <span id="updateText"></span>
  <button id="updateDownload" type="button" hidden>نزّل الآن</button>
  <button id="updateRestart" type="button" hidden>أعد التشغيل الآن</button>
  <button id="updateDismiss" type="button" title="إخفاء">✕</button>
</div>

<!-- مربع الأذونات العربي: مكوّن Web Component (تفكيك ت-8) — الطابور والرد داخله -->
<satr-perm-dialog role="dialog" aria-modal="true" aria-label="طلب إذن لاستخدام أداة"></satr-perm-dialog>

<!-- أسئلة الاختيار العربية (AskUserQuestion، محرك SDK): مكوّن مستقل، الرد بمؤشرات فقط -->
<satr-question-dialog></satr-question-dialog>

<!-- لوحة /جلسات: مكوّن Web Component (تفكيك ت-4) — الاستئناف حدث session-resume للقشرة -->
<satr-sessions-panel aria-label="الجلسات المحفوظة"></satr-sessions-panel>

<!-- لوحة ملفات المشروع (الدفعة 1.2): شجرة قراءة فقط + عارض + بحث محتوى (4.6) -->
<!-- لوحة 📄 الملفات + بحث المحتوى: مكوّن Web Component (تفكيك ت-6) — فتح ملف عبر حدث file-open -->
<satr-files-panel aria-label="ملفات المشروع"></satr-files-panel>

<!-- لوحة تغييرات git (الدفعة 4.7): عرض فقط — لا commit ولا revert من «سطر» -->
<!-- لوحة ± git: مكوّن Web Component (تفكيك ت-5) — بطاقات الفرق عبر ui/lib/diff.js المشتركة -->
<satr-git-panel aria-label="تغييرات المشروع"></satr-git-panel>

<!-- عارض القراءة (الدفعة 1.2) + تحرير خفيف (الدفعة 4): textarea بديل عند التحرير -->
<!-- عارض القراءة/التحرير: مكوّن Web Component (تفكيك ت-7) — بطاقة الحفظ عبر حدث file-saved -->
<satr-file-viewer role="dialog" aria-modal="true" aria-label="عارض ملف"></satr-file-viewer>

<!-- لوحة /مهارات: مكوّن Web Component (تفكيك ت-2) — يملك حالة المفعّل/المعطّل -->
<satr-skills-panel aria-label="المهارات"></satr-skills-panel>

<!-- لوحة /موصلات: مكوّن Web Component (تفكيك ت-3) -->
<satr-mcp-panel aria-label="موصّلات MCP"></satr-mcp-panel>

<!-- لوحة /وكلاء: مكوّن Web Component (تفكيك ت-1) — بنيته وأنماطه داخل Shadow DOM -->
<satr-agents-panel aria-label="الوكلاء الفرعيون"></satr-agents-panel>

<!-- لوحة /سياق: مكوّن Web Component (تفكيك ت-3) -->
<satr-context-panel aria-label="استخدام السياق"></satr-context-panel>

<!-- لوحة /ذاكرة: مراجعة المرشّحات وإدارة ذاكرة المشروع الشخصية المنفصلة عن المحادثة -->
<satr-memory-panel aria-label="ذاكرة المشروع"></satr-memory-panel>

<!-- لوحة /بحث: منسّق 1–3 باحثين للقراءة فقط مع خلاصات ومصادر -->
<satr-research-panel aria-label="فريق البحث"></satr-research-panel>

<!-- حوار قرار غرفة العمليات: تشغيل الاختبارات والدمج لا يمران عبر toast أو confirm أصلي -->
<satr-ops-dialog role="dialog" aria-modal="true" aria-label="تأكيد قرار غرفة العمليات"></satr-ops-dialog>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<!-- القشرة وحدة ES منذ ت-13 — أول الوحدات تنفيذاً (ترتيب المستند) فتربط مستمعيها قبل ترقية المكوّنات -->
<script type="module" src="ui/app.js"></script>
<!-- مكوّنات الواجهة المفكّكة (وحدات ES ذاتية التسجيل — تنفيذها بعد القشرة، والقشرة تتفاعل بالأحداث) -->
<script type="module" src="ui/components/agents-panel.js"></script>
<script type="module" src="ui/components/skills-panel.js"></script>
<script type="module" src="ui/components/mcp-panel.js"></script>
<script type="module" src="ui/components/context-panel.js"></script>
<script type="module" src="ui/components/memory-panel.js"></script>
<script type="module" src="ui/components/research-panel.js"></script>
<script type="module" src="ui/components/ops-room.js"></script>
<script type="module" src="ui/components/execution-panel.js"></script>
<script type="module" src="ui/components/sessions-panel.js"></script>
<script type="module" src="ui/components/git-panel.js"></script>
<script type="module" src="ui/components/files-panel.js"></script>
<script type="module" src="ui/components/file-viewer.js"></script>
<script type="module" src="ui/components/gate.js"></script>
<script type="module" src="ui/components/perm-dialog.js"></script>
<script type="module" src="ui/components/question-dialog.js"></script>
<script type="module" src="ui/components/terminal-panel.js"></script>
<script type="module" src="ui/components/composer.js"></script>
<script type="module" src="ui/components/topbar.js"></script>
<script type="module" src="ui/components/chat.js"></script>
<script type="module" src="ui/components/preview-panel.js"></script>
<!-- وحدات lib المشتركة تصل كاعتماديات استيراد من المكوّنات — جسر window.SatrUI أُزيل في ت-13 -->
</body>
</html>
