<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة الموردين — تسجيل الدخول</title>
<!-- صفحة تجريبية لمشهد §3 في إعلان «سطر» (التسليم البشري 🤝) — لا خدمة حقيقية،
     لا شبكة، والإرسال يعرض حالة نجاح محلية فقط كي يُصوَّر استئناف الوكيل. -->
<style>
  :root {
    --bg: #111110; --surface: #191918; --border: #3b3a37;
    --text: #eeeeec; --dim: #b5b3ad; --gold: #D9A441; --on-gold: #1A1408;
    --green: #71d083;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(80rem 40rem at 50% -10%, #1c1a15, var(--bg));
    color: var(--text);
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  }
  .card {
    width: min(92vw, 24rem); background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 2.2rem;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .brand { text-align: center; margin-bottom: 1.6rem; }
  .brand .logo {
    display: inline-grid; place-items: center; width: 3.2rem; height: 3.2rem;
    border-radius: 12px; background: var(--gold); color: var(--on-gold);
    font-size: 1.5rem; font-weight: 700; margin-bottom: .6rem;
  }
  .brand h1 { margin: 0; font-size: 1.25rem; }
  .brand p { margin: .3rem 0 0; color: var(--dim); font-size: .9rem; }
  label { display: block; font-size: .88rem; color: var(--dim); margin: 1rem 0 .35rem; }
  input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: .7rem .9rem; font: inherit;
  }
  input:focus { outline: none; border-color: var(--gold); }
  input[type="email"] { direction: ltr; text-align: left; }
  button {
    width: 100%; margin-top: 1.5rem; padding: .8rem; border: 0; border-radius: 10px;
    background: var(--gold); color: var(--on-gold); font: inherit; font-weight: 700;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  .hint { text-align: center; color: var(--dim); font-size: .78rem; margin-top: 1.2rem; }
  /* حالة ما بعد الدخول */
  #done { display: none; text-align: center; }
  #done .check {
    display: inline-grid; place-items: center; width: 3.6rem; height: 3.6rem;
    border-radius: 50%; background: rgba(113, 208, 131, .15); color: var(--green);
    font-size: 1.8rem; margin-bottom: 1rem; border: 1px solid rgba(113, 208, 131, .4);
  }
  #done h2 { margin: 0 0 .4rem; font-size: 1.2rem; }
  #done p { color: var(--dim); margin: 0; font-size: .95rem; line-height: 1.9; }
  body.authed #loginForm { display: none; }
  body.authed #done { display: block; }
</style>
</head>
<body>
  <div class="card">
    <form id="loginForm">
      <div class="brand">
        <span class="logo">م</span>
        <h1>بوابة المورّدين</h1>
        <p>سجّل دخولك لمتابعة طلبات المتجر</p>
      </div>
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="off" placeholder="you@example.com" required>
      <label for="pass">كلمة المرور</label>
      <input id="pass" type="password" autocomplete="off" required>
      <button type="submit">دخول</button>
      <p class="hint">بيئة تجريبية للعرض — لا تُرسل أي بيانات</p>
    </form>
    <div id="done">
      <span class="check">✓</span>
      <h2>أهلاً بك — تم تسجيل الدخول</h2>
      <p>لوحة الطلبات جاهزة.<br>يمكن للوكيل الآن متابعة مهمته.</p>
    </div>
  </div>
<script>
  // لا شبكة إطلاقاً: النجاح محلي بصري فقط لأجل مشهد الاستئناف
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    document.body.classList.add('authed');
  });
</script>
</body>
</html>
